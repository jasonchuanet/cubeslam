services:
  cubeslam:
    image: ghcr.io/jasonchuanet/cubeslam:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      TURN_URLS: "${TURN_URLS:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      ICE_SERVERS: "${ICE_SERVERS:-[]}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
